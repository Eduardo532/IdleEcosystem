name: Android CI

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de prueba
        run: ./gradlew assembleDebug

      - name: Publicar reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests
          path: app/build/reports/tests/

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-prueba
          path: app/build/outputs/apk/debug/*.apk

      # En ramas que no son main, el APK se publica como "pre-release" para
      # descargarlo directo desde el teléfono (sección Releases del repositorio).
      - name: Publicar APK de prueba en Releases
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="prueba-$(echo "$BRANCH" | tr '/' '-')"
          APK="IdleEcosystem-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de prueba ($BRANCH)" \
            --notes "Versión de prueba de la rama \`$BRANCH\` (commit ${GITHUB_SHA::7}).

          Se instala como **IdleEcosystem Prueba** junto a la app normal, sin reemplazarla.
          Tiene sus propios datos: para probar con tu partida, exporta el código en la app normal e impórtalo aquí."
