name: Build check
on:
  push:
    branches: [ tmp/map-screens ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Screens
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*MapShots*'
