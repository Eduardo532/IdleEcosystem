name: Build check

# Compiles the debug APK and runs the unit tests on every push and pull request,
# so each feature/fix branch is verified before it is merged into develop.
on:
  push:
    branches-ignore: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Assemble debug and preview APKs
        run: ./gradlew assembleDebug assemblePreview

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
