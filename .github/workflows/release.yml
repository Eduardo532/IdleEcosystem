name: Release oficial

# Se ejecuta de dos formas:
#   - Automática: al fusionar en main un archivo NUEVO de notas oficiales
#     .github/release-notes/vX.Y.Z.md. La primera línea ("# vX.Y.Z - Título") da el
#     nombre de la release.
#   - A mano desde la pestaña Actions ("Run workflow"), indicando versión y título.
#
# Después de cada ejecución, el job "cleanup" borra las alpha/beta que ya quedaron
# cubiertas por la última versión oficial (ver más abajo).
# Compila el APK de release, lo firma con la clave del proyecto (secretos del
# repositorio), comprueba que la firma sea la clave del proyecto y publica la release con su tag y el archivo app-release.apk.
on:
  push:
    branches: [ main ]
    paths:
      - '.github/release-notes/v*.md'
      # También al cambiar este archivo: así la limpieza corre apenas se fusiona
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (debe coincidir con versionName), ej: 0.10.0'
        required: true
      title:
        description: 'Nombre de la release (lo que va después de "vX.Y.Z - ")'
        required: true

permissions:
  contents: write

env:
  # Huella SHA-256 del certificado de la clave de release del proyecto
  # (CN=E Gomez, creada en noviembre de 2026 para la v0.10.0). Las versiones
  # futuras deben firmarse con esta misma clave para instalarse encima de la
  # anterior; si el APK no tiene esta firma, la release se cancela.
  # (La v0.8.0 usó otra clave, que se perdió: 414f2864...7aeccdbe)
  EXPECTED_CERT_SHA256: 6de0b0524548dbd5ec6ce7e6e162ba9fca8b4f18586c262b17e8f89b882d482c

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determinar versión
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TITLE="$INPUT_TITLE"
          else
            # Solo notas oficiales nuevas (vX.Y.Z.md); las de alpha/beta no cuentan
            FILE=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- .github/release-notes/ \
              | grep -E '^\.github/release-notes/v[0-9]+\.[0-9]+\.[0-9]+\.md$' | tail -1)
            if [ -z "$FILE" ]; then
              echo "No hay notas oficiales nuevas en este push; no se publica nada."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION=$(basename "$FILE" .md | sed 's/^v//')
            TITLE=$(head -1 "$FILE" | sed -E 's/^#\s*v[0-9.]+\s*-\s*//')
          fi
          {
            echo "skip=false"
            echo "version=$VERSION"
            echo "title=$TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Comprobar versión y tag
        if: steps.meta.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GRADLE_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "::error::La versión pedida ($VERSION) no coincide con versionName en app/build.gradle.kts ($GRADLE_VERSION)."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Ya existe una release v$VERSION. No se sobrescribe una release oficial."
            exit 1
          fi
          if [ ! -f ".github/release-notes/v$VERSION.md" ]; then
            echo "::error::Faltan las notas: .github/release-notes/v$VERSION.md"
            exit 1
          fi

      - name: Comprobar secretos de firma
        if: steps.meta.outputs.skip == 'false'
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing"
            exit 1
          fi

      - name: Restaurar keystore
        if: steps.meta.outputs.skip == 'false'
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Configurar JDK 17
        if: steps.meta.outputs.skip == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Caché de Gradle integrada (antes gradle/actions/setup-gradle)
          cache: gradle

      - name: Compilar APK de release
        if: steps.meta.outputs.skip == 'false'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verificar firma
        if: steps.meta.outputs.skip == 'false'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::La firma del APK ($ACTUAL) no es la clave de release del proyecto. Revisa el keystore y el alias."
            exit 1
          fi
          echo "Firma correcta: es la clave de release del proyecto."

      - name: Publicar release
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          gh release create "v$VERSION" app/build/outputs/apk/release/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "v$VERSION - $TITLE" \
            --notes-file ".github/release-notes/v$VERSION.md" \
            --latest

      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  # Borra las pre-releases (alpha/beta) cuya versión ya tiene release oficial:
  # con la v0.11.1 publicada sobran v0.11.1-beta.1, v0.11.0-alpha.1, etc.
  # Solo se borra la release de GitHub; el tag de git se conserva como historial y
  # las notas siguen en .github/release-notes/. Las de versiones futuras (por
  # ejemplo, v0.12.0-alpha.1 con la v0.11.1 como última oficial) no se tocan.
  cleanup:
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Borrar alpha/beta ya oficializadas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          LATEST=$(gh api "repos/$REPO/releases/latest" -q .tag_name 2>/dev/null || true)
          LATEST=${LATEST#v}
          if ! echo "$LATEST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No hay una release oficial con versión X.Y.Z; no se borra nada."
            exit 0
          fi
          echo "Última versión oficial: v$LATEST"

          gh api --paginate "repos/$REPO/releases" -q '.[] | select(.prerelease) | .tag_name' |
          while read -r TAG; do
            BASE=$(echo "$TAG" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta)\.[0-9]+$/\1/p')
            [ -z "$BASE" ] && continue
            # BASE <= LATEST (comparación de versiones, no de texto)
            if [ "$(printf '%s\n%s\n' "$BASE" "$LATEST" | sort -V | tail -1)" = "$LATEST" ]; then
              echo "Borrando $TAG (cubierta por v$LATEST); el tag se conserva."
              gh release delete "$TAG" --repo "$REPO" --yes
            else
              echo "Se conserva $TAG (versión futura)."
            fi
          done
