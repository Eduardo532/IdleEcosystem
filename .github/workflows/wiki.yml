# Publishes the wiki/ folder to the GitHub wiki of this repository.
#
# The wiki/ folder is the source of truth: every page lives there, is reviewed with
# the code and is copied to the wiki on each push that touches it. Pages created or
# edited directly on GitHub are overwritten (or removed) on the next sync.
#
# GitHub only creates the wiki repository after its first page is saved from the
# web. If the sync fails with "the wiki does not exist yet", open the Wiki tab,
# save any first page and run this workflow again (Actions -> Wiki -> Run workflow).
name: Wiki

on:
  push:
    branches: [main, claude/develop]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$url" wiki-repo 2>/dev/null; then
            echo "::error::The wiki does not exist yet. Open the Wiki tab, save a first page and run this workflow again."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA::7}"
          git push
